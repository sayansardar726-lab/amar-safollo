ext-align:left;color:var(--ink);transition:.18s}.feature:hover,.subject:hover{transform:translateY(-2px);box-shadow:0 15px 30px #5264a01a}.icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:25px}.lav{background:#eeeaff}.blu{background:#e5f3ff}.pin{background:#ffe9f0}.grn{background:#e0faf2}.org{background:#fff0dd}.feature b{font-size:16px}.feature small{color:var(--muted)}.subject{cursor:pointer;display:flex;align-items:center;gap:13px;text-align:left;transition:.18s}.subject .icon{flex-shrink:0}.subject strong{display:block}.subject small{display:block;color:var(--muted);margin-top:4px}.subject .arrow{margin-left:auto;color:#9aa4bd;font-size:22px}.page{margin-top:14px}.back{background:transparent;color:var(--purple);font-weight:800;padding:8px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{padding:12px 16px;border-radius:13px;font-weight:800;background:#eeeaff;color:#6553dd}.primary{background:linear-gradient(110deg,#7665ee,#589ef2);color:#fff}.danger{background:#fff0f2;color:#db4b70}.success{background:#e0faf2;color:#168e72}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0;flex:1;min-width:180px}.field label{font-size:12px;color:#65708b;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe4f2;background:#fbfcff;border-radius:12px;padding:12px;color:var(--ink);outline-color:#8b7cf6}.field textarea{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 12px}.notice{background:#fff8e9;color:#8b641c;border-radius:14px;padding:12px;font-size:13px;margin:12px 0}.listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.badge{font-size:11px;font-weight:800;background:#f0edff;color:#6958e5;padding:6px 9px;border-radius:99px}.qcard{margin:14px 0}.option{display:block;width:100%;text-align:left;background:#f8f9ff;border:1px solid #e8ebf7;border-radius:12px;padding:12px;margin:8px 0;color:var(--ink)}.option.selected{border-color:#7665ee;background:#efedff}.option.correct{border-color:#36bd9b;background:#e2faf2}.option.wrong{border-color:#f07899;background:#fff0f4}.progress{height:8px;background:#e8ebf7;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#7665ee,#4cbbd9);width:0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f8f8ff;border-radius:15px;padding:15px}.stat b{display:block;font-size:22px}.hidden{display:none!important}.footer{text-align:center;color:#a0a8bc;font-size:12px;padding:26px 0 10px}.tiny{font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 12px;color:var(--muted)}.tabs button.active{background:#eeeaff;color:#6553dd;border-color:#d9d2ff}@media(max-width:560px){.app{padding:13px}.hero{padding:22px;border-radius:23px}.top{align-items:flex-start}.brand h1{font-size:19px}.statgrid{grid-template-columns:repeat(3,1fr)}.card{padding:15px}}

const SEED=[{"id": "Math-0", "subject": "Math", "chapter": "Simplification", "questions": [{"id": "Math-0-0", "text": "25% of 240 is:", "options": ["40", "50", "60", "80"], "answer": 2, "explanation": "25% = 1/4; 240 ÷ 4 = 60."}, {"id": "Math-0-1", "text": "If 3x = 27, then x = ?", "options": ["6", "9", "12", "3"], "answer": 1, "explanation": "x = 27 ÷ 3 = 9."}, {"id": "Math-0-2", "text": "The average of 4, 8 and 12 is:", "options": ["6", "7", "8", "9"], "answer": 2, "explanation": "Average = (4 + 8 + 12) ÷ 3 = 8."}, {"id": "Math-0-3", "text": "Simplify: 18 ÷ 3 × 2", "options": ["3", "6", "12", "18"], "answer": 2, "explanation": "Division and multiplication are evaluated left to right."}, {"id": "Math-0-4", "text": "A ratio is 2:3 and total is 25. The first part is:", "options": ["10", "12", "15", "5"], "answer": 0, "explanation": "Total parts = 5; one part = 5; first part = 10."}, {"id": "Math-0-5", "text": "The square of 13 is:", "options": ["156", "169", "179", "196"], "answer": 1, "explanation": "13 × 13 = 169."}, {"id": "Math-0-6", "text": "A train travels 120 km in 2 hours. Speed is:", "options": ["40 km/h", "50 km/h", "60 km/h", "80 km/h"], "answer": 2, "explanation": "Speed = distance ÷ time = 60 km/h."}, {"id": "Math-0-7", "text": "LCM of 6 and 8 is:", "options": ["12", "18", "24", "48"], "answer": 2, "explanation": "The smallest common multiple is 24."}]}, {"id": "Math-1", "subject": "Math", "chapter": "Percentage", "questions": []}, {"id": "Math-2", "subject": "Math", "chapter": "Ratio & Proportion", "questions": []}, {"id": "Reasoning-0", "subject": "Reasoning", "chapter": "Analogy", "questions": [{"id": "Reasoning-0-0", "text": "Find the next number: 2, 4, 8, 16, ?", "options": ["18", "24", "30", "32"], "answer": 3, "explanation": "Each number is multiplied by 2."}, {"id": "Reasoning-0-1", "text": "Book is to Read as Food is to:", "options": ["Cook", "Eat", "Buy", "Serve"], "answer": 1, "explanation": "A book is read; food is eaten."}, {"id": "Reasoning-0-2", "text": "Find the odd one out:", "options": ["Triangle", "Square", "Circle", "Cube"], "answer": 3, "explanation": "Cube is 3D; the others are 2D shapes."}, {"id": "Reasoning-0-3", "text": "If CAT is coded as DBU, DOG is coded as:", "options": ["EPH", "CNG", "EOG", "FPH"], "answer": 0, "explanation": "Each letter shifts one step forward."}, {"id": "Reasoning-0-4", "text": "Monday, Wednesday, Friday, ?", "options": ["Saturday", "Sunday", "Tuesday", "Thursday"], "answer": 1, "explanation": "The sequence advances by two days."}, {"id": "Reasoning-0-5", "text": "Which number does not belong?", "options": ["9", "16", "25", "27"], "answer": 3, "explanation": "9, 16 and 25 are perfect squares."}, {"id": "Reasoning-0-6", "text": "A is taller than B; B is taller than C. Who is shortest?", "options": ["A", "B", "C", "Cannot say"], "answer": 2, "explanation": "A > B > C, so C is shortest."}, {"id": "Reasoning-0-7", "text": "Complete: AZ, BY, CX, ?", "options": ["DW", "EV", "DU", "EX"], "answer": 0, "explanation": "First letter moves forward; second moves backward."}]}, {"id": "Reasoning-1", "subject": "Reasoning", "chapter": "Number Series", "questions": []}, {"id": "Reasoning-2", "subject": "Reasoning", "chapter": "Coding-Decoding", "questions": []}, {"id": "Geography-0", "subject": "Geography", "chapter": "Indian Geography", "questions": [{"id": "Geography-0-0", "text": "Which is the largest state of India by area?", "options": ["Uttar Pradesh", "Rajasthan", "Madhya Pradesh", "Maharashtra"], "answer": 1, "explanation": "Rajasthan is the largest Indian state by area."}, {"id": "Geography-0-1", "text": "The Ganga originates from which glacier?", "options": ["Siachen", "Gangotri", "Zemu", "Pindari"], "answer": 1, "explanation": "The Bhagirathi, a headstream of the Ganga, rises near Gangotri Glacier."}, {"id": "Geography-0-2", "text": "Which line divides Earth into Northern and Southern Hemispheres?", "options": ["Tropic of Cancer", "Prime Meridian", "Equator", "Arctic Circle"], "answer": 2, "explanation": "The Equator is at 0° latitude."}, {"id": "Geography-0-3", "text": "Which is the largest ocean?", "options": ["Atlantic", "Indian", "Arctic", "Pacific"], "answer": 3, "explanation": "The Pacific Ocean is the largest."}, {"id": "Geography-0-4", "text": "The Thar Desert is mainly in:", "options": ["Gujarat", "Rajasthan", "Punjab", "Bihar"], "answer": 1, "explanation": "Most of the Thar Desert lies in Rajasthan."}, {"id": "Geography-0-5", "text": "Which planet is known as the Red Planet?", "options": ["Venus", "Mars", "Jupiter", "Mercury"], "answer": 1, "explanation": "Iron oxide gives Mars its reddish appearance."}, {"id": "Geography-0-6", "text": "Which Indian state has the longest coastline?", "options": ["Tamil Nadu", "Andhra Pradesh", "Gujarat", "Kerala"], "answer": 2, "explanation": "Gujarat has the longest coastline among Indian states."}, {"id": "Geography-0-7", "text": "Monsoon winds bring most rainfall to India during:", "options": ["Winter", "Summer season", "Spring only", "Autumn only"], "answer": 1, "explanation": "The southwest monsoon brings most of India’s annual rainfall."}]}, {"id": "Geography-1", "subject": "Geography", "chapter": "World Geography", "questions": []}, {"id": "Geography-2", "subject": "Geography", "chapter": "Rivers & Climate", "questions": []}, {"id": "History-0", "subject": "History", "chapter": "Ancient India", "questions": [{"id": "History-0-0", "text": "Who was the first Mughal emperor in India?", "options": ["Akbar", "Babur", "Humayun", "Shah Jahan"], "answer": 1, "explanation": "Babur founded the Mughal Empire after the First Battle of Panipat in 1526."}, {"id": "History-0-1", "text": "The Great Bath was found at:", "options": ["Harappa", "Lothal", "Mohenjo-daro", "Dholavira"], "answer": 2, "explanation": "The Great Bath is a famous structure at Mohenjo-daro."}, {"id": "History-0-2", "text": "Who led the Dandi March in 1930?", "options": ["Subhas Chandra Bose", "Mahatma Gandhi", "Jawaharlal Nehru", "Sardar Patel"], "answer": 1, "explanation": "Gandhi led the Salt March to protest the salt tax."}, {"id": "History-0-3", "text": "The Battle of Plassey took place in:", "options": ["1757", "1764", "1857", "1707"], "answer": 0, "explanation": "The Battle of Plassey was fought in 1757."}, {"id": "History-0-4", "text": "Who was known as the Iron Man of India?", "options": ["B. R. Ambedkar", "Sardar Vallabhbhai Patel", "Bhagat Singh", "Lal Bahadur Shastri"], "answer": 1, "explanation": "Sardar Patel is popularly called the Iron Man of India."}, {"id": "History-0-5", "text": "Ashoka belonged to which dynasty?", "options": ["Gupta", "Maurya", "Chola", "Kushan"], "answer": 1, "explanation": "Ashoka was a Mauryan emperor."}, {"id": "History-0-6", "text": "The Quit India Movement began in:", "options": ["1920", "1930", "1942", "1947"], "answer": 2, "explanation": "The movement was launched in August 1942."}, {"id": "History-0-7", "text": "Who wrote the book Hind Swaraj?", "options": ["Rabindranath Tagore", "Mahatma Gandhi", "B. G. Tilak", "Bankim Chandra"], "answer": 1, "explanation": "Gandhi wrote Hind Swaraj in 1909."}]}, {"id": "History-1", "subject": "History", "chapter": "Medieval India", "questions": []}, {"id": "History-2", "subject": "History", "chapter": "Modern India", "questions": []}, {"id": "Polity-0", "subject": "Polity", "chapter": "Constitution Basics", "questions": [{"id": "Polity-0-0", "text": "When was the Constitution of India adopted?", "options": ["15 Aug 1947", "26 Nov 1949", "26 Jan 1950", "2 Oct 1949"], "answer": 1, "explanation": "The Constituent Assembly adopted it on 26 November 1949."}, {"id": "Polity-0-1", "text": "When did the Constitution of India come into effect?", "options": ["15 Aug 1947", "26 Nov 1949", "26 Jan 1950", "1 Jan 1950"], "answer": 2, "explanation": "It came into effect on 26 January 1950."}, {"id": "Polity-0-2", "text": "Who is the constitutional head of India?", "options": ["Prime Minister", "President", "Chief Justice", "Speaker"], "answer": 1, "explanation": "The President is the constitutional head of the Union."}, {"id": "Polity-0-3", "text": "Fundamental Rights are in which Part of the Constitution?", "options": ["Part I", "Part II", "Part III", "Part IV"], "answer": 2, "explanation": "Fundamental Rights are covered in Part III."}, {"id": "Polity-0-4", "text": "Which house is the Upper House of Parliament?", "options": ["Lok Sabha", "Rajya Sabha", "Vidhan Sabha", "Gram Sabha"], "answer": 1, "explanation": "Rajya Sabha is the Council of States, the Upper House."}, {"id": "Polity-0-5", "text": "Who appoints the Prime Minister of India?", "options": ["Chief Justice", "President", "Lok Sabha Speaker", "Election Commission"], "answer": 1, "explanation": "The President appoints the Prime Minister."}, {"id": "Polity-0-6", "text": "Directive Principles are in which Part?", "options": ["Part III", "Part IV", "Part V", "Part VI"], "answer": 1, "explanation": "Directive Principles of State Policy are in Part IV."}, {"id": "Polity-0-7", "text": "The minimum voting age in India is:", "options": ["16", "18", "21", "25"], "answer": 1, "explanation": "The voting age was lowered to 18 years."}]}, {"id": "Polity-1", "subject": "Polity", "chapter": "Fundamental Rights", "questions": []}, {"id": "Polity-2", "subject": "Polity", "chapter": "Parliament", "questions": []}];function normalizeDb(raw){if(!Array.isArray(raw)||!raw.length)raw=SEED;if(raw.every(x=>Array.isArray(x.chapters)))return raw.map(s=>({...s,chapters:s.chapters.map(c=>({...c,questions:Array.isArray(c.questions)?c.questions:[]}))}));const grouped=[];for(const item of raw){if(!item||!item.subject)continue;let sub=grouped.find(s=>s.label===item.subject);if(!sub){sub={id:String(item.subject).toLowerCase().replace(/[^a-z0-9]+/g,'-'),label:item.subject,icon:({'Math':'🔢','Reasoning':'🧠','Geography':'🌍','History':'🏛️','Polity':'⚖️'}[item.subject]||'📘'),chapters:[]};grouped.push(sub)}let ch=sub.chapters.find(c=>c.name===item.chapter);if(!ch){ch={id:item.id||('ch-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)),name:item.chapter||'General',questions:[]};sub.chapters.push(ch)}if(Array.isArray(item.questions))ch.questions.push(...item.questions)}return grouped.length?grouped:normalizeDb(SEED)}let db=normalizeDb(JSON.parse(localStorage.getItem('safolyo_db')||'null')||SEED);let users=JSON.parse(localStorage.getItem('safolyo_users')||'[]');let current=JSON.parse(localStorage.getItem('safolyo_current')||'null');let results=JSON.parse(localStorage.getItem('safolyo_results')||'[]');let mode='user',page='home',activeSubject='',activeChapter='',quiz=null,editing=null,quizTimer=null;localStorage.setItem('safolyo_db',JSON.stringify(db));const root=document.getElementById('root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('safolyo_db',JSON.stringify(db));localStorage.setItem('safolyo_users',JSON.stringify(users));localStorage.setItem('safolyo_current',JSON.stringify(current));localStorage.setItem('safolyo_results',JSON.stringify(results))}function btn(t,fn,cl='btn'){return `<button class="${cl}" onclick="${fn}">${t}</button>`}function head(title,sub=''){return `<div class="section-title"><div><h3>${title}</h3><div class="muted tiny">${sub}</div></div></div>`}function ensure(){if(!current){showAccount();return false}return true}function home(){page='home';let total=db.reduce((a,s)=>a+s.chapters.reduce((n,c)=>n+c.questions.length,0),0);root.innerHTML=`<section class="hero"><h2>Your next success starts here ✨</h2><p>Practice smarter. Track progress. Reach your goal.</p><span class="tag">📚 ${db.length} subjects &nbsp; · &nbsp; 📝 ${total} sample questions</span></section>${head('Choose your practice','A little practice every day goes a long way')}<div class="grid"><button class="card feature" onclick="subjectList('module')"><span class="icon lav">📘</span><b>Module Test</b><small>Practice by subject and chapter</small></button><button class="card feature" onclick="startFull()"><span class="icon blu">📝</span><b>Full Syllabus Mock Test</b><small>Mixed questions from all subjects</small></button><button class="card feature" onclick="historyPage()"><span class="icon pin">🏆</span><b>Review & History</b><small>Results and answer explanations</small></button><button class="card feature" onclick="leaderboardPage()"><span class="icon org">🥇</span><b>Leaderboard</b><small>See best scores on this device</small></button><button class="card feature" onclick="dailyChallenge()"><span class="icon grn">⚡</span><b>Daily Challenge</b><small>Quick 10-question practice</small></button><button class="card feature" onclick="analyticsPage()"><span class="icon org">📊</span><b>Performance Analytics</b><small>Track scores and practice progress</small></button><button class="card feature" onclick="studyCoachPage()"><span class="icon lav">🗓️</span><b>Study Planner & Coach</b><small>Set a goal, view weak areas and plan practice</small></button><button class="card feature" onclick="achievementPage()"><span class="icon org">🏅</span><b>Achievements</b><small>Unlock badges as you improve</small></button><button class="card feature" onclick="friendChallengePage()"><span class="icon pin">🤝</span><b>Challenge a Friend</b><small>Share your score and invite a friend</small></button><button class="card feature" onclick="savedQuestionsPage()"><span class="icon lav">🔖</span><b>Saved Questions</b><small>Bookmark questions to revise later</small></button><button class="card feature" onclick="mistakeBookPage()"><span class="icon pin">📕</span><b>Mistake Book</b><small>Collect wrong answers and practise again</small></button><button class="card feature" onclick="profilePage()"><span class="icon grn">📈</span><b>My Profile & Progress</b><small>Your practice overview</small></button></div>${head('Explore subjects','Choose a subject to see its chapters')}<div class="grid">${db.map((s,i)=>`<button class="card subject" onclick="openSubject('${s.id}')"><span class="icon ${['lav','blu','pin','grn','org'][i%5]}">${s.icon}</span><span><strong>${esc(s.label)}</strong><small>${s.chapters.length} chapters · ${s.chapters.reduce((n,c)=>n+c.questions.length,0)} questions</small></span><span class="arrow">›</span></button>`).join('')}</div>${mode==='admin'?`<div class="card" style="margin-top:16px">${head('Admin Studio','Manage subjects, chapters and questions')}<div class="row">${btn('＋ Add Subject','subjectForm()','btn primary')}${btn('Manage Content','adminPage()','btn')}</div></div>`:''}`;document.getElementById('accountBtn').textContent=current?`👤 ${esc(current.name.split(' ')[0])} · ${mode==='admin'?'Admin':'User'}`:'👤 Register / Login'}
function showAccount(){page='account';root.innerHTML=`<div class="card" style="max-width:680px;margin:12px auto"><div class="icon lav">👋</div><h2 style="margin-bottom:4px">Welcome to AMAR SAFOLLO</h2><p class="muted">Create your profile with basic details to start practicing.</p><div class="tabs"><button id="regTab" class="active" onclick="accountTab('reg')">Register</button><button id="loginTab" onclick="accountTab('login')">Login</button><button onclick="accountTab('admin')">Admin login</button></div><div id="accountForm"></div><div class="notice">Demo version: registration is saved only in this browser. Mobile OTP verification and secure multi-device accounts need a server.</div></div>`;accountTab('reg')}
function accountTab(which){let box=document.getElementById('accountForm');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(which==='reg')document.getElementById('regTab')?.classList.add('active');if(which==='login')document.getElementById('loginTab')?.classList.add('active');if(which==='admin')document.querySelectorAll('.tabs button')[2]?.classList.add('active');box.innerHTML=which==='reg'?`<form onsubmit="registerUser(event)"><div class="formgrid"><div class="field"><label>Full name *</label><input name="name" required maxlength="60" placeholder="Enter your name"></div><div class="field"><label>Age *</label><input name="age" type="number" min="10" max="100" required placeholder="Your age"></div><div class="field"><label>Mobile number *</label><input name="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit mobile number"></div><div class="field"><label>State</label><input name="state" placeholder="e.g. West Bengal"></div><div class="field"><label>Exam goal (optional)</label><input name="goal" placeholder="e.g. SSC, Railway, ITI"></div></div><button class="btn primary" type="submit">Create account →</button></form>`:which==='login'?`<form onsubmit="loginUser(event)"><div class="field"><label>Registered mobile number</label><input name="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit mobile number"></div><button class="btn primary">Continue →</button></form><p class="muted tiny">This prototype uses a local profile, not SMS OTP.</p>`:`<form onsubmit="adminLogin(event)"><div class="field"><label>Admin PIN</label><input name="pin" type="password" required placeholder="Admin PIN"></div><button class="btn primary">Login as Admin →</button></form>`}
function registerUser(e){e.preventDefault();let f=new FormData(e.target),mobile=String(f.get('mobile')||'').replace(/\D/g,'').trim(),u={name:String(f.get('name')||'').trim(),age:Number(f.get('age')),mobile,state:String(f.get('state')||'').trim(),goal:String(f.get('goal')||'').trim(),role:'user'};if(!/^[0-9]{10}$/.test(mobile)){alert('Please enter a valid 10-digit mobile number.');return}let existing=users.find(x=>String(x.mobile||'').replace(/\D/g,'')===mobile);if(existing){alert('এই নম্বরটি আগে থেকেই রেজিস্টার করা আছে। Login ট্যাবে গিয়ে একই নম্বর দিন।');accountTab('login');let inp=document.querySelector('#accountForm input[name="mobile"]');if(inp)inp.value=mobile;return}users.push(u);current=u;mode='user';save();home()}function loginUser(e){e.preventDefault();let mobile=String(new FormData(e.target).get('mobile')||'').replace(/\D/g,'').trim();let u=users.find(x=>String(x.mobile||'').replace(/\D/g,'')===mobile);if(!u){alert('এই নম্বরটি রেজিস্টার করা নেই। Register ট্যাবে গিয়ে নতুন অ্যাকাউন্ট তৈরি করুন।');accountTab('reg');let inp=document.querySelector('#accountForm input[name="mobile"]');if(inp)inp.value=mobile;return}current=u;mode='user';save();home()}function adminLogin(e){e.preventDefault();let pin=String(new FormData(e.target).get('pin')||'').trim();if(pin!=='2468'){alert('Admin PIN ভুল। 2468 দিন।');return}current={name:'Administrator',mobile:'ADMIN',role:'admin'};mode='admin';save();home()}function logout(){current=null;mode='user';save();home()}
function openSubject(id){activeSubject=id;let s=db.find(x=>x.id===id);page='subject';root.innerHTML=`${btn('← Home',"home()",'back')}<section class="hero" style="background:linear-gradient(120deg,#67cdb1,#62a9f4)"><h2>${s.icon} ${esc(s.label)}</h2><p>Select a chapter to practice its questions.</p></section>${head('Chapters',`${s.chapters.length} chapters · ${s.chapters.reduce((n,c)=>n+c.questions.length,0)} questions`)}<div class="grid">${s.chapters.map((c,i)=>`<button class="card subject" onclick="openChapter('${s.id}','${c.id}')"><span class="icon ${['lav','blu','pin','grn','org'][i%5]}">📂</span><span><strong>${esc(c.name)}</strong><small>${c.questions.length} questions</small></span><span class="arrow">›</span></button>`).join('')}</div>${mode==='admin'?btn('＋ Add Chapter','chapterForm(\''+s.id+'\')','btn primary'):''}`}

function startChapter(sid,cid){let s=db.find(x=>x.id===sid),c=s.chapters.find(x=>x.id===cid);if(!ensure())return;if(!c.questions.length){alert('This chapter has no questions yet. Please choose another chapter.');return}beginQuiz(c.questions,`${s.label} · ${c.name}`)}function startFull(){if(!ensure())return;let q=db.flatMap(s=>s.chapters.flatMap(c=>c.questions));if(!q.length){alert('No questions have been added yet.');return}beginQuiz(q,'Full Syllabus Mock Test')}
function beginQuiz(questions,title){if(quizTimer){clearInterval(quizTimer);quizTimer=null}quiz={questions:questions.map(q=>({...q})),title,answers:{},index:0,started:Date.now(),seconds:Math.max(60,questions.length*30)};renderQuiz();quizTimer=setInterval(()=>{if(!quiz||page!=='quiz')return;quiz.seconds--;let el=document.getElementById('timerClock');if(el)el.textContent=formatTime(quiz.seconds);if(quiz.seconds<=0){clearInterval(quizTimer);quizTimer=null;alert('Time is up! Your test will be submitted.');submitQuiz(true)}},1000)}function formatTime(n){n=Math.max(0,n|0);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function renderQuiz(){page='quiz';let q=quiz.questions[quiz.index];root.innerHTML=`${btn('✕ Exit test','exitQuiz()','back')}<div class="card"><div class="row" style="justify-content:space-between"><span class="badge">${esc(quiz.title)}</span><span class="badge">⏱ <span id="timerClock">${formatTime(quiz.seconds)}</span></span><span class="muted tiny">Question ${quiz.index+1} of ${quiz.questions.length}</span></div><div class="progress" style="margin:15px 0"><span style="width:${(quiz.index+1)/quiz.questions.length*100}%"></span></div><h3>${esc(q.text)}</h3><div class="row" style="margin:8px 0 12px">${btn(isQuestionSaved(q.id)?"🔖 Saved":"☆ Save question","toggleCurrentQuestionSaved()","btn")}</div>${q.options.map((o,i)=>`<button class="option ${quiz.answers[q.id]===i?'selected':''}" onclick="choose(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}<div class="row" style="justify-content:space-between;margin-top:18px">${btn('← Previous','moveQ(-1)','btn')}${quiz.index===quiz.questions.length-1?btn('Submit test ✓','submitQuiz()','btn primary'):btn('Next →','moveQ(1)','btn primary')}</div></div>`}function choose(i){quiz.answers[quiz.questions[quiz.index].id]=i;renderQuiz()}function moveQ(n){quiz.index=Math.max(0,Math.min(quiz.questions.length-1,quiz.index+n));renderQuiz()}function exitQuiz(){if(confirm('Exit this test? Your answers will not be saved.')){if(quizTimer){clearInterval(quizTimer);quizTimer=null}quiz=null;home()}}function submitQuiz(auto=false){if(!quiz)return;if(quizTimer){clearInterval(quizTimer);quizTimer=null}let correct=0,wrong=0,skipped=0;quiz.questions.forEach(q=>{if(quiz.answers[q.id]===q.answer)correct++;else if(quiz.answers[q.id]===undefined)skipped++;else wrong++});let netScore=Math.max(0,correct-wrong*0.25);let r={id:Date.now(),title:quiz.title,date:new Date().toLocaleString(),total:quiz.questions.length,correct,wrong,skipped,netScore,answers:quiz.answers,questions:quiz.questions,user:current?.name||'Guest',mobile:current?.mobile||''};results.unshift(r);save();renderResult(r)}function renderResult(r){page='result';root.innerHTML=`<div class="card" style="text-align:center"><div class="icon grn" style="margin:auto">🏆</div><h2>Test completed!</h2><p class="muted">${esc(r.title)} · ${esc(r.date)}</p><div class="statgrid"><div class="stat"><b>${Number(r.netScore??r.correct).toFixed(2)}</b><small>Net score (−0.25/wrong)</small></div><div class="stat"><b>${Math.round(r.correct/r.total*100)}%</b><small>Percentage</small></div><div class="stat"><b>${r.wrong??(r.total-r.correct)}</b><small>Wrong answers</small></div></div><div class="row" style="justify-content:center;margin-top:18px">${btn('Review answers','reviewResult('+r.id+')','btn primary')}${btn('Save PDF','savePDF('+r.id+')','btn')}${btn('Home','home()','btn')}</div></div>`}function reviewResult(id){let r=results.find(x=>x.id===id);root.innerHTML=`${btn('← Results','historyPage()','back')}${head('Answer Review',esc(r.title))}${r.questions.map((q,i)=>`<div class="card qcard"><b>${i+1}. ${esc(q.text)}</b>${q.options.map((o,j)=>`<div class="option ${j===q.answer?'correct':(r.answers[q.id]===j?'wrong':'')}">${'ABCD'[j]}. ${esc(o)} ${j===q.answer?'✓ Correct answer':''} ${r.answers[q.id]===j&&j!==q.answer?'· Your answer':''}</div>`).join('')}<p class="muted tiny">${esc(q.explanation||'No explanation added.')}</p></div>`).join('')}`}
function historyPage(){page='history';root.innerHTML=`${btn('← Home','home()','back')}${head('Review & History','Your previous tests')}<div class="card">${results.length?results.map(r=>`<div class="listitem"><div><b>${esc(r.title)}</b><div class="muted tiny">${esc(r.date)} · ${Number(r.netScore??r.correct).toFixed(2)} net · ${r.correct}/${r.total} (${Math.round(r.correct/r.total*100)}%)</div></div><div class="row">${btn('Review',`reviewResult(${r.id})`,'btn')}${btn('PDF',`savePDF(${r.id})`,'btn')}</div></div>`).join(''):'<p class="muted">No test history yet. Complete a test to see results here.</p>'}</div>`}function leaderboardPage(){let rows=results.slice().sort((a,b)=>Number(b.netScore??b.correct)-Number(a.netScore??a.correct)).slice(0,20);root.innerHTML=`${btn('← Home','home()','back')}${head('🏆 Leaderboard','Best mock-test scores saved on this browser/device')}<div class="notice">এই র‍্যাঙ্কিং শুধু এই ব্রাউজারে সংরক্ষিত ফলাফল থেকে তৈরি। অনলাইন র‍্যাঙ্কিংয়ের জন্য সার্ভার/ডেটাবেস লাগবে।</div><div class="card">${rows.length?rows.map((r,i)=>`<div class="listitem"><div><b>${['🥇','🥈','🥉'][i]||('#'+(i+1))} ${esc(r.user||'User')}</b><div class="muted tiny">${esc(r.title)} · ${esc(r.date)}</div></div><span class="badge">${Number(r.netScore??r.correct).toFixed(2)} pts</span></div>`).join(''):'<p class="muted">এখনও কোনো টেস্টের ফলাফল নেই। আগে একটি Mock Test দাও।</p>'}</div>`}function profilePage(){let attempts=results.length,correct=results.reduce((a,r)=>a+r.correct,0),total=results.reduce((a,r)=>a+r.total,0);root.innerHTML=`${btn('← Home','home()','back')}${head('My Profile & Progress','Your learning dashboard')}<div class="card"><h2>${esc(current?.name||'Guest')}</h2><p class="muted">${esc(current?.goal||'Exam preparation')} · ${esc(current?.mobile||'')}</p><div class="statgrid"><div class="stat"><b>${attempts}</b><small>Tests</small></div><div class="stat"><b>${total?Math.round(correct/total*100):0}%</b><small>Accuracy</small></div><div class="stat"><b>${total}</b><small>Questions tried</small></div></div><div class="row" style="margin-top:16px">${btn('Edit profile','showAccount()','btn')}${btn('Logout','logout()','btn danger')}</div></div>`}
function adminPage(){if(mode!=='admin'){alert('Admin access required.');return}root.innerHTML=`${btn('← Home','home()','back')}${head('Admin Studio','Manage subjects → chapters → questions')}<div class="row">${btn('＋ Add Subject','subjectForm()','btn primary')}${btn('Export backup','backup()','btn')}${btn('Import backup','document.getElementById(\'backupFile\').click()','btn')}</div><input id="backupFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(event)"><div class="card" style="margin-top:14px">${db.map(s=>`<div class="listitem"><div><b>${s.icon} ${esc(s.label)}</b><div class="muted tiny">${s.chapters.length} chapters · ${s.chapters.reduce((n,c)=>n+c.questions.length,0)} questions</div></div><div class="row">${btn('Open',`openSubject('${s.id}')`,'btn')}${btn('Rename',`subjectForm('${s.id}')`,'btn')}${btn('Delete',`deleteSubject('${s.id}')`,'btn danger')}</div></div>`).join('')}</div>`}
function subjectForm(id=''){if(mode!=='admin')return;let s=db.find(x=>x.id===id),name=prompt((s?'Rename':'Add')+' subject — enter name:',s?.label||'');if(name===null)return;name=name.trim();if(!name)return;if(s){s.label=name}else{let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now();db.push({id:slug,label:name,icon:'📘',chapters:[]})}save();adminPage()}function chapterForm(sid,cid=''){if(mode!=='admin')return;let s=db.find(x=>x.id===sid),c=s.chapters.find(x=>x.id===cid),name=prompt((c?'Rename':'Add')+' chapter — '+s.label, c?.name||'');if(name===null)return;name=name.trim();if(!name)return;if(c)c.name=name;else s.chapters.push({id:'ch-'+Date.now(),name,questions:[]});save();openSubject(sid)}function questionForm(sid,cid,qid=''){if(mode!=='admin')return;let s=db.find(x=>x.id===sid),c=s.chapters.find(x=>x.id===cid),q=c.questions.find(x=>x.id===qid);editing={sid,cid,qid};root.innerHTML=`${btn('← Chapter',`openChapter('${sid}','${cid}')`,'back')}<div class="card"><h2>${q?'Edit question':'Add question'}</h2><p class="muted">${esc(s.label)} / ${esc(c.name)}</p><form onsubmit="saveQuestion(event)"><div class="field"><label>Question text *</label><textarea name="text" required>${esc(q?.text||'')}</textarea></div><div class="formgrid">${[0,1,2,3].map(i=>`<div class="field"><label>Option ${'ABCD'[i]} *</label><input name="o${i}" required value="${esc(q?.options[i]||'')}"></div>`).join('')}</div><div class="field"><label>Correct answer *</label><select name="answer">${[0,1,2,3].map(i=>`<option value="${i}" ${q?.answer===i?'selected':''}>${'ABCD'[i]}</option>`).join('')}</select></div><div class="field"><label>Explanation (optional)</label><textarea name="explanation">${esc(q?.explanation||'')}</textarea></div><button class="btn primary">Save question ✓</button></form></div>`}function saveQuestion(e){e.preventDefault();let f=new FormData(e.target),s=db.find(x=>x.id===editing.sid),c=s.chapters.find(x=>x.id===editing.cid),q={id:editing.qid||'q-'+Date.now(),text:f.get('text').trim(),options:[0,1,2,3].map(i=>f.get('o'+i).trim()),answer:Number(f.get('answer')),explanation:f.get('explanation').trim()};let i=c.questions.findIndex(x=>x.id===q.id);if(i>=0)c.questions[i]=q;else c.questions.push(q);save();openChapter(editing.sid,editing.cid)}function deleteQuestion(sid,cid,qid){if(confirm('Delete this question?')){let c=db.find(x=>x.id===sid).chapters.find(x=>x.id===cid);c.questions=c.questions.filter(q=>q.id!==qid);save();openChapter(sid,cid)}}function deleteChapter(sid,cid){if(confirm('Delete this chapter and all its questions?')){let s=db.find(x=>x.id===sid);s.chapters=s.chapters.filter(c=>c.id!==cid);save();openSubject(sid)}}function deleteSubject(sid){if(confirm('Delete this subject and all chapters/questions?')){db=db.filter(s=>s.id!==sid);save();adminPage()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({db,users,results},null,2)],{type:'application/json'}));a.download='AMAR-SAFOLLO-backup.json';a.click();URL.revokeObjectURL(a.href)}function restoreBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.db))throw 0;db=x.db;users=x.users||users;results=x.results||results;save();alert('Backup restored.');adminPage()}catch{alert('Invalid backup file.')}};r.readAsText(file)}function savePDF(id){let r=results.find(x=>x.id===id);let w=window.open('','_blank');if(!w){alert('Allow pop-ups to save PDF.');return}w.document.write(`<html><head><title>AMAR SAFOLLO Result</title><style>body{font-family:Arial;padding:24px;color:#24304a}h1{color:#7665ee}.q{padding:12px;border-bottom:1px solid #ddd}.good{color:green}</style></head><body><h1>AMAR SAFOLLO · Test Report</h1><h2>${esc(r.title)}</h2><p>${esc(r.date)}</p><h3>Net score: ${Number(r.netScore??r.correct).toFixed(2)} · Correct: ${r.correct}/${r.total} · Wrong: ${r.wrong??(r.total-r.correct)} · ${Math.round(r.correct/r.total*100)}%</h3>${r.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.text)}</b><p class="good">Correct answer: ${esc(q.options[q.answer])}</p><p>${esc(q.explanation||'')}</p></div>`).join('')}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function dailyChallenge(){if(!ensure())return;let all=db.flatMap(s=>s.chapters.flatMap(c=>c.questions.map(q=>({...q,_subject:s.label,_chapter:c.name}))));if(!all.length){alert('প্রথমে Admin থেকে প্রশ্ন যোগ করতে হবে।');return}let shuffled=all.slice().sort(()=>Math.random()-.5).slice(0,Math.min(10,all.length));beginQuiz(shuffled,'Daily Challenge · 10 Questions')}
function analyticsPage(){if(!ensure())return;let mine=results.filter(r=>String(r.mobile||'')===String(current?.mobile||''));let attempts=mine.length,avg=attempts?mine.reduce((a,r)=>a+Number(r.netScore??r.correct),0)/attempts:0,best=attempts?Math.max(...mine.map(r=>Number(r.netScore??r.correct))):0,total=mine.reduce((a,r)=>a+Number(r.total||0),0),correct=mine.reduce((a,r)=>a+Number(r.correct||0),0);let subjectStats={};mine.forEach(r=>(r.questions||[]).forEach((q,i)=>{let sub=q._subject||db.find(s=>s.chapters.some(c=>c.questions.some(z=>z.id===q.id)))?.label||'Mixed / older test';let item=subjectStats[sub]||(subjectStats[sub]={seen:0,correct:0});item.seen++;if(r.answers&&r.answers[q.id]===q.answer)item.correct++}));let bars=Object.entries(subjectStats).sort((a,b)=>(b[1].correct/(b[1].seen||1))-(a[1].correct/(a[1].seen||1)));root.innerHTML=`${btn('← Home','home()','back')}${head('📊 Performance Analytics','Your results on this browser')}<div class="statgrid"><div class="stat"><b>${attempts}</b><small>Tests completed</small></div><div class="stat"><b>${total?Math.round(correct/total*100):0}%</b><small>Overall accuracy</small></div><div class="stat"><b>${avg.toFixed(2)}</b><small>Average net score</small></div><div class="stat"><b>${best.toFixed(2)}</b><small>Best net score</small></div></div><div class="card" style="margin-top:14px">${head('Subject practice breakdown','Accuracy is calculated from saved answers')}${bars.length?bars.map(([name,v])=>{let pct=Math.round(v.correct/Math.max(1,v.seen)*100);return `<div style="margin:14px 0"><div class="row" style="justify-content:space-between"><b>${esc(name)}</b><span class="muted tiny">${v.correct}/${v.seen} · ${pct}%</span></div><div style="height:9px;background:#edf0fa;border-radius:20px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#7665ee,#35c9a3);border-radius:20px"></div></div></div>`}).join(''):'<p class="muted">এখনও কোনো টেস্টের ফলাফল নেই। আগে একটি টেস্ট দাও।</p>'}</div><div class="card" style="margin-top:14px">${head('Keep improving','A simple routine works best')}<p>✓ প্রতিদিন Daily Challenge দাও।</p><p>✓ ভুল উত্তরের explanation পড়ো।</p><p>✓ যে বিষয়ের accuracy কম, সেই বিষয়ে Module Test করো।</p>${btn('Start Daily Challenge','dailyChallenge()','btn primary')}</div>`}

function studyCoachPage(){
 if(!ensure())return;
 const plan=JSON.parse(localStorage.getItem('safolyo_study_plan')||'{}');
 const mine=results.filter(r=>String(r.mobile||'')===String(current?.mobile||''));
 const dates=[...new Set(mine.map(r=>{let d=new Date(r.id);return isNaN(d)?'':d.toISOString().slice(0,10)}).filter(Boolean))].sort().reverse();
 let streak=0, cursor=new Date(); cursor.setHours(0,0,0,0);
 const dayset=new Set(dates);
 if(!dayset.has(cursor.toISOString().slice(0,10)))cursor.setDate(cursor.getDate()-1);
 while(dayset.has(cursor.toISOString().slice(0,10))&&streak<365){streak++;cursor.setDate(cursor.getDate()-1)}
 const areas={}; mine.forEach(r=>(r.questions||[]).forEach(q=>{const sub=q._subject||'Mixed practice';const key=sub+' — '+(q._chapter||'General');const a=areas[key]||(areas[key]={seen:0,correct:0});a.seen++;if(r.answers&&r.answers[q.id]===q.answer)a.correct++}));
 const weak=Object.entries(areas).filter(([,a])=>a.seen>=2).sort((a,b)=>(a[1].correct/a[1].seen)-(b[1].correct/b[1].seen)).slice(0,5);
 const today=new Date().toISOString().slice(0,10);
 root.innerHTML=`${btn('← Home','home()','back')}${head('🗓️ Study Planner & Coach','A simple personal plan saved on this device')}
 <div class="statgrid"><div class="stat"><b>${streak} 🔥</b><small>Day streak</small></div><div class="stat"><b>${mine.length}</b><small>Your tests</small></div><div class="stat"><b>${weak.length}</b><small>Weak areas found</small></div></div>
 <div class="card" style="margin-top:14px"><h3>🎯 Set your study goal</h3><p class="muted tiny">Choose a daily target and (optionally) your exam date. Your plan stays in this browser.</p><form onsubmit="saveStudyPlan(event)"><div class="formgrid"><div class="field"><label>Daily study target</label><select name="hours"><option value="30" ${String(plan.hours||'60')==='30'?'selected':''}>30 minutes</option><option value="60" ${String(plan.hours||'60')==='60'?'selected':''}>1 hour</option><option value="90" ${String(plan.hours||'60')==='90'?'selected':''}>1.5 hours</option><option value="120" ${String(plan.hours||'60')==='120'?'selected':''}>2 hours</option><option value="180" ${String(plan.hours||'60')==='180'?'selected':''}>3 hours</option></select></div><div class="field"><label>Target exam date (optional)</label><input type="date" name="examDate" min="${today}" value="${esc(plan.examDate||'')}"></div><div class="field"><label>Weekly rest day (optional)</label><select name="rest"><option value="None">No fixed rest day</option>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(d=>`<option ${plan.rest===d?'selected':''}>${d}</option>`).join('')}</select></div></div><button class="btn primary">Save my plan ✓</button></form>${plan.saved?`<p class="notice">Plan saved. Daily target: ${Number(plan.hours)/60} hour(s) · Rest day: ${esc(plan.rest||'None')}${plan.examDate?' · Exam date: '+esc(plan.examDate):''}</p>`:''}</div>
 <div class="card" style="margin-top:14px"><h3>📌 Your recommended next steps</h3>${weak.length?weak.map(([name,a])=>`<div class="listitem"><div><b>${esc(name)}</b><div class="muted tiny">${a.correct}/${a.seen} correct · ${Math.round(a.correct/a.seen*100)}% accuracy</div></div><span class="badge">Revise</span></div>`).join(''):'<p class="muted">এখনও যথেষ্ট পরীক্ষার তথ্য নেই। কয়েকটি টেস্ট দেওয়ার পর দুর্বল অধ্যায়ের সুপারিশ দেখা যাবে।</p>'}<div class="row" style="margin-top:14px">${btn('Start Daily Challenge','dailyChallenge()','btn primary')}${btn('Choose a subject','subjectList(\'module\')','btn')}</div></div>
 <div class="notice">মনে রাখবে: স্ট্রিক ও স্টাডি প্ল্যান এই ব্রাউজারের লোকাল ডেটার উপর নির্ভর করে। ব্রাউজারের ডেটা মুছে গেলে বা অন্য ডিভাইসে গেলে তা নিজে থেকে সিঙ্ক হবে না।</div>`;
}
function saveStudyPlan(e){e.preventDefault();const f=new FormData(e.target);localStorage.setItem('safolyo_study_plan',JSON.stringify({hours:f.get('hours'),examDate:f.get('examDate'),rest:f.get('rest'),saved:true}));studyCoachPage()}

function showAccountFromCurrent(){showAccount()}home();

function achievementPage(){
 if(!ensure())return;
 const tests=results.length, best=results.reduce((m,r)=>Math.max(m,Number(r.netScore??r.correct)||0),0), perfect=results.some(r=>r.total>0&&r.correct===r.total), totalQ=results.reduce((n,r)=>n+(Number(r.total)||0),0), accuracy=totalQ?Math.round(results.reduce((n,r)=>n+(Number(r.correct)||0),0)/totalQ*100):0;
 const badges=[
  ['🌱','First Step','Complete your first mock test',tests>=1],
  ['🔥','Practice Warrior','Complete 5 tests',tests>=5],
  ['🎯','Accuracy Ace','Reach 80% overall accuracy',accuracy>=80&&tests>0],
  ['💯','Perfect Run','Get every question correct in a test',perfect],
  ['📚','Question Explorer','Attempt 100 questions',totalQ>=100],
  ['🏆','High Scorer','Earn a net score of 8 or more in a test',best>=8]
 ];
 root.innerHTML=`${btn('← Home','home()','back')}${head('🏅 Achievements','Practice consistently and unlock milestones')}<div class="card"><div class="statgrid"><div class="stat"><b>${tests}</b><small>Tests completed</small></div><div class="stat"><b>${totalQ}</b><small>Questions attempted</small></div><div class="stat"><b>${accuracy}%</b><small>Overall accuracy</small></div></div><p class="muted tiny" style="margin-top:12px">Badges are calculated from results saved in this browser.</p></div><div class="grid" style="margin-top:14px">${badges.map(b=>`<div class="card" style="opacity:${b[3]?1:.58}"><div class="icon ${b[3]?'org':'lav'}">${b[0]}</div><h3>${esc(b[1])} ${b[3]?'✓':'🔒'}</h3><p class="muted">${esc(b[2])}</p><span class="badge">${b[3]?'Unlocked':'Not yet unlocked'}</span></div>`).join('')}</div>`;
}
function friendChallengePage(){
 if(!ensure())return;
 const latest=results.slice().sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0))[0];
 const best=results.reduce((m,r)=>Math.max(m,Number(r.netScore??r.correct)||0),0);
 const challengeText=`🏆 AMAR SAFOLLO Friend Challenge!\nI am preparing with AMAR SAFOLLO. My best net score is ${best.toFixed(2)} points across ${results.length} test(s).\nCan you beat my score? Open AMAR SAFOLLO and try a Full Syllabus Mock Test!\nশিখুন · অনুশীলন করুন · সফল হোন`;
 root.innerHTML=`${btn('← Home','home()','back')}${head('🤝 Challenge a Friend','Invite a friend to beat your mock-test score')}<div class="card"><div class="icon pin">🏆</div><h2>Your challenge card</h2><p class="muted">${latest?`Latest test: ${esc(latest.title)} · Score: ${Number(latest.netScore??latest.correct).toFixed(2)} · ${latest.correct}/${latest.total} correct`:'You have not completed a test yet. Take one first, then share your score.'}</p><div class="statgrid"><div class="stat"><b>${results.length}</b><small>Tests</small></div><div class="stat"><b>${best.toFixed(2)}</b><small>Best net score</small></div></div><div class="field" style="margin-top:14px"><label>Challenge message</label><textarea id="challengeMsg" rows="5" readonly>${esc(challengeText)}</textarea></div><div class="row">${btn('📤 Share challenge','shareChallenge()','btn primary')}${btn('📋 Copy message','copyChallenge()','btn')}</div><div class="notice" style="margin-top:14px">নোট: এটি শেয়ারযোগ্য আমন্ত্রণ বার্তা—এখনও অনলাইন multiplayer বা live friend ranking নয়। বন্ধুদের ফলাফল এই ডিভাইসে স্বয়ংক্রিয়ভাবে যুক্ত হবে না।</div></div>`;
}
function copyChallenge(){const el=document.getElementById('challengeMsg');if(!el)return;el.select();el.setSelectionRange(0,99999);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el.value).then(()=>alert('Challenge message copied!')).catch(()=>{document.execCommand('copy');alert('Challenge message copied!')})}else{document.execCommand('copy');alert('Challenge message copied!')}}
function shareChallenge(){const el=document.getElementById('challengeMsg');if(!el)return;const data={title:'AMAR SAFOLLO Friend Challenge',text:el.value};if(navigator.share)navigator.share(data).catch(()=>{});else copyChallenge()}


function getSavedQuestionIds(){try{return JSON.parse(localStorage.getItem('safolyo_saved_questions_'+String(current?.mobile||'guest'))||'[]')}catch(e){return []}}
function isQuestionSaved(id){return getSavedQuestionIds().includes(String(id))}
function toggleCurrentQuestionSaved(){if(!quiz)return;toggleSavedQuestion(quiz.questions[quiz.index].id)}
function toggleSavedQuestion(id){let ids=getSavedQuestionIds();id=String(id);if(ids.includes(id))ids=ids.filter(x=>x!==id);else ids.push(id);localStorage.setItem('safolyo_saved_questions_'+String(current?.mobile||'guest'),JSON.stringify(ids));if(page==='quiz')renderQuiz();else if(page==='mistakes')mistakeBookPage();else savedQuestionsPage()}
function allQuestions(){return db.flatMap(s=>s.chapters.flatMap(c=>c.questions.map(q=>({...q,_subject:s.label,_chapter:c.name}))))}
function savedQuestionsPage(){if(!ensure())return;page='saved';const ids=getSavedQuestionIds(),qs=allQuestions().filter(q=>ids.includes(String(q.id)));root.innerHTML=`${btn('← Home','home()','back')}${head('🔖 Saved Questions','Questions you bookmarked for revision')}<div class="card">${qs.length?qs.map((q,i)=>`<div class="listitem"><div><b>${i+1}. ${esc(q.text)}</b><div class="muted tiny">${esc(q._subject)} · ${esc(q._chapter)}</div></div><button class="btn danger" onclick="toggleSavedQuestionById(this.dataset.id)" data-id="${esc(q.id)}">Remove</button></div>`).join('')+`<div class="row" style="margin-top:14px">${btn('Practise saved questions','startSavedPractice()','btn primary')}</div>`:'<p class="muted">এখনও কোনো প্রশ্ন সেভ করা হয়নি। পরীক্ষা দেওয়ার সময় “☆ Save question” চাপলে এখানে পাবে।</p>'}</div>`}
function toggleSavedQuestionById(id){toggleSavedQuestion(id)}
function startSavedPractice(){if(!ensure())return;const ids=getSavedQuestionIds(),qs=allQuestions().filter(q=>ids.includes(String(q.id)));if(!qs.length){alert('আগে কিছু প্রশ্ন সেভ করো।');return}beginQuiz(qs,'Saved Questions Practice')}
function mistakeBookPage(){if(!ensure())return;page='mistakes';const wrongMap=new Map();results.filter(r=>String(r.mobile||'')===String(current?.mobile||'')).forEach(r=>(r.questions||[]).forEach(q=>{if(r.answers?.[q.id]!==undefined&&r.answers[q.id]!==q.answer){if(!wrongMap.has(String(q.id)))wrongMap.set(String(q.id),{...q,wrongCount:0,_subject:q._subject||'Mixed practice',_chapter:q._chapter||''});wrongMap.get(String(q.id)).wrongCount++}}));const qs=[...wrongMap.values()].sort((a,b)=>b.wrongCount-a.wrongCount);root.innerHTML=`${btn('← Home','home()','back')}${head('📕 Mistake Book','Questions you answered incorrectly in saved test results')}<div class="card"><div class="statgrid"><div class="stat"><b>${qs.length}</b><small>Unique mistakes</small></div><div class="stat"><b>${qs.reduce((n,q)=>n+q.wrongCount,0)}</b><small>Total wrong attempts</small></div><div class="stat"><b>${qs.filter(q=>q.wrongCount>1).length}</b><small>Repeated mistakes</small></div></div>${qs.length?qs.map((q,i)=>`<div class="card qcard"><b>${i+1}. ${esc(q.text)}</b><div class="muted tiny" style="margin:6px 0">${esc(q._subject)} · ${esc(q._chapter)} · Missed ${q.wrongCount} time(s)</div><p><b>Correct answer:</b> ${esc(q.options?.[q.answer]??'')}</p><p class="muted tiny">${esc(q.explanation||'No explanation added.')}</p><button class="btn" data-id="${esc(q.id)}" onclick="toggleSavedQuestionById(this.dataset.id)">${isQuestionSaved(q.id)?'🔖 Saved':'☆ Save for revision'}</button></div>`).join('')+`<div class="row">${btn('Practise mistakes','startMistakePractice()','btn primary')}</div>`:'<p class="muted" style="margin-top:14px">এখনও কোনো ভুল উত্তর পাওয়া যায়নি। একটি টেস্ট শেষ করার পর ভুল প্রশ্ন এখানে জমা হবে।</p>'}</div>`}
function startMistakePractice(){if(!ensure())return;const wrongMap=new Map();results.filter(r=>String(r.mobile||'')===String(current?.mobile||'')).forEach(r=>(r.questions||[]).forEach(q=>{if(r.answers?.[q.id]!==undefined&&r.answers[q.id]!==q.answer&&!wrongMap.has(String(q.id)))wrongMap.set(String(q.id),q)}));const qs=[...wrongMap.values()];if(!qs.length){alert('Mistake Book-এ এখনো প্রশ্ন নেই।');return}beginQuiz(qs,'Mistake Book Revision')}

</script></body></html>
